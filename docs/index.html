<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hamster app" />
    <meta name="theme-color" content="#ff6b35" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hamster" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css?v=2" />
    <title>Hamster</title>
  </head>
  <body>
    <header>
      <h1>🐹 Hamster</h1>
      <p id="today-date"></p>
    </header>

    <main>
      <div class="card" id="status-card">
        <div class="status-icon" id="status-icon"></div>
        <h2 class="status-heading" id="status-heading"></h2>
        <p class="status-detail" id="status-detail"></p>
        <button class="feed-btn" id="feed-btn" onclick="recordFeeding()">
          Record feeding now
        </button>
      </div>

      <div class="card last-fed-card" id="last-fed-card" style="display: none">
        <p class="label">Last fed</p>
        <p class="last-fed-date" id="last-fed-date"></p>
      </div>
    </main>

    <script src="app.js?v=2"></script>
  </body>
</html>
